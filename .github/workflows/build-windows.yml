name: Build Windows EXE

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python deps
        run: pip install -r requirements-dev.txt pyinstaller

      - name: Download FFmpeg (bundled so the app works fully offline)
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp
          $bin = Get-ChildItem ffmpeg_tmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $bin.FullName bin\ffmpeg.exe
          Copy-Item (Join-Path $bin.DirectoryName "ffprobe.exe") bin\ffprobe.exe
          bin\ffmpeg.exe -version | Select-Object -First 1
          "$PWD\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Download whisper.cpp (offline speech recognition, bundled)
        shell: pwsh
        run: |
          $url = "https://github.com/ggml-org/whisper.cpp/releases/download/b5130/whisper-bin-x64.zip"
          Invoke-WebRequest $url -OutFile whisper.zip
          Expand-Archive whisper.zip -DestinationPath whisper_tmp
          $cli = Get-ChildItem whisper_tmp -Recurse -Filter whisper-cli.exe | Select-Object -First 1
          New-Item -ItemType Directory -Force bin\whisper | Out-Null
          Copy-Item $cli.FullName bin\whisper\whisper-cli.exe
          Get-ChildItem $cli.DirectoryName -Filter *.dll | Copy-Item -Destination bin\whisper

      - name: Cache the bundled speech model
        uses: actions/cache@v4
        with:
          path: models/whisper
          key: whisper-model-ggml-base.en-v1

      - name: Download the speech model that is bundled INSIDE the app
        shell: pwsh
        run: |
          $file = "ggml-base.en.bin"
          New-Item -ItemType Directory -Force models\whisper | Out-Null
          $dest = "models\whisper\$file"
          if (-not (Test-Path $dest) -or (Get-Item $dest).Length -lt 140000000) {
            Invoke-WebRequest "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/$file" -OutFile $dest
          }
          if ((Get-Item $dest).Length -lt 140000000) { throw "Speech model download looks incomplete" }

      - name: Tests (lyrics, ASS, real FFmpeg renders, GUI)
        shell: bash
        run: python -m pytest -q tests
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUTF8: "1"

      - name: Build EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --onefile --windowed --name IdeawoodStudioArtists `
            --icon assets\icon.ico --add-data "assets;assets" --add-data "models;models" `
            --add-binary "bin\ffmpeg.exe;bin" --add-binary "bin\ffprobe.exe;bin" `
            --add-data "bin\whisper;bin\whisper" `
            --hidden-import PySide6.QtMultimedia `
            main.py
          Copy-Item dist\IdeawoodStudioArtists.exe "dist\IdeawoodStudioArtists-${{ github.ref_name }}.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: IdeawoodStudioArtists-windows
          path: dist/IdeawoodStudioArtists.exe

      - name: Release notes from CHANGELOG (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          $text = Get-Content CHANGELOG.md -Raw
          $m = [regex]::Match($text, "(?ms)^## " + [regex]::Escape($ver) + " .*?(?=^## |\z)")
          if ($m.Success) { $m.Value | Set-Content notes.md -Encoding utf8 } else { "Release $ver" | Set-Content notes.md }

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Ideawood Studio for Artists ${{ github.ref_name }}
          body_path: notes.md
          files: dist/IdeawoodStudioArtists-${{ github.ref_name }}.exe
